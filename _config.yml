# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 'si0n4ra'
subtitle: '...chasing dreams, living reality'
description: 'Personal blog where you can find a lot of information about me and my projects'
author: si0n4ra
language: en
timezone: 'Europe/Kiev'
sitemap:
    path: sitemap.xml


# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://ooge0.github.io/hexo-blog
# root: /
root: /hexo-blog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: false # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: '**/notes/test/**'

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
marked:
  prependRoot: true
  postAsset: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false 
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''


# Footnotes / references
reference:
  enable: true          # Enable the hexo-reference plugin
  footnote: true         # Enable footnotes
  backreference: true    # Adds back-reference links from footnotes
  lowercase: true        # Set footnotes to lowercase
  unique_id: true        # Ensure each footnote has a unique ID



# Home page setting
# path: Root path for your blog index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 6
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

search:
  path: search.xml
  field: post
  format: html
  limit: 10000

# hexo-generator-searchdb — used by Fluid for local search
searchdb:
  path: local-search.xml
  field: post
  content: true
  format: striptags


# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'date'

# Pagination
## Set per_page to 0 to disable pagination
# per_page defined in index_generator above — removed duplicate here
# pagination_dir: _posts
pagination_dir: Posts

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude: /source/_posts/notes/test
ignore: /source/_posts/notes/test

# Extensions
## Plugins: https://hexo.io/plugins/

plugins:
  - hexo-reference
  - hexo-generator-search
  - hexo-footnotes
  
## Themes: https://hexo.io/themes/
theme: fluid

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/ooge0/hexo-blog.git
  branch: master
  # To deploy: set GITHUB_TOKEN env variable first, then run hexo deploy
  # Windows: set GITHUB_TOKEN=ghp_your_token_here
  token: $GITHUB_TOKEN